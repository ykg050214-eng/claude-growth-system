    title: "Claude Code 用プロジェクトテンプレート自動生成ツール"
    description: |
      Claude Codeが効率的に動くよう、プロジェクトの種類を指定すると
      CLAUDE.md + フォルダ構成 + .gitignore を自動生成するツールを実装する。

      対応プロジェクトタイプ：
      - python-script（Pythonスクリプト）
      - web-app（HTML/CSS/JS）
      - data-pipeline（データパイプライン）
      - api-integration（API連携）

    type: "code_generation"
    priority: "high"
    difficulty: "easy"
    estimated_minutes: 25
    dependencies: []

    implementation:
      language: "python"
      output_dir: "projects/20260508_task002_template_gen/"
      dependencies: []

      steps:
        - "STEP1: プロジェクトタイプのテンプレート辞書を定義"
        - "STEP2: 各タイプのCLAUDE.mdテンプレートを作成"
        - "STEP3: フォルダ構成を自動作成する関数を実装"
        - "STEP4: .gitignoreをタイプ別に生成"
        - "STEP5: コマンドライン引数でタイプと出力先を指定"
        - "STEP6: 生成結果のサマリーを表示"

      sample_code: |
        import os
        import argparse
        from pathlib import Path

        TEMPLATES = {
            "python-script": {
                "dirs": ["src", "tests", "data", "logs"],
                "claude_md": "# プロジェクト概要\n\n## 実行方法\npython src/main.py\n",
            },
            "web-app": {
                "dirs": ["src", "public", "assets"],
                "claude_md": "# Webアプリ\n\n## 構成\nindex.html をブラウザで開く\n",
            }
        }

        def generate(project_type: str, output_dir: str):
            path = Path(output_dir)
            path.mkdir(parents=True, exist_ok=True)
            template = TEMPLATES.get(project_type, TEMPLATES["python-script"])
            for d in template["dirs"]:
                (path / d).mkdir(exist_ok=True)
            (path / "CLAUDE.md").write_text(template["claude_md"])
            print(f"生成完了: {output_dir}")

      expected_output: "template_gen.py"
      test_command: "python template_gen.py python-script my_new_project"
      notes: "生成されたフォルダ構造を表示するtreeコマンドも実装すると良い"

    status: "pending"
    completed_at: null
    output_path: null
    execution_notes: null

