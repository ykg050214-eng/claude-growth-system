tasks:
  - id: "task_001"
    source_video_id: "vid_003"
    title: "Claude API リサーチ自動化スクリプト"
    description: |
      Claude Opus 4.6の100万トークンコンテキストを活用して、
      複数のテキストソースを一度に読み込み、横断的なリサーチレポートを
      自動生成するPythonスクリプトを実装する。

      入力：検索キーワード + 複数のテキストファイル（またはURL）
      出力：Markdownフォーマットのリサーチレポート

    type: "code_generation"
    priority: "high"
    difficulty: "medium"
    estimated_minutes: 40
    dependencies: []

    implementation:
      language: "python"
      output_dir: "projects/20260508_task001_research_bot/"
      dependencies:
        - "anthropic>=0.40.0"
        - "requests"
        - "python-dotenv"

      steps:
        - "STEP1: anthropic クライアントを初期化（APIキーは.envから読む）"
        - "STEP2: 入力テキストファイルを全て読み込んで結合する"
        - "STEP3: システムプロンプトに「研究者」ペルソナを設定"
        - "STEP4: claude-opus-4-6 モデルでリサーチレポートを生成"
        - "STEP5: レポートをMarkdownファイルとして保存"
        - "STEP6: コマンドライン引数でキーワードと入力ファイルを指定できるようにする"

      sample_code: |
        import anthropic
        import argparse
        from pathlib import Path

        def research(keyword: str, input_files: list[str]) -> str:
            client = anthropic.Anthropic()

            # 全ファイルの内容を結合
            combined_text = ""
            for f in input_files:
                combined_text += Path(f).read_text(encoding="utf-8") + "\n\n"

            message = client.messages.create(
                model="claude-opus-4-6",
                max_tokens=4096,
                system="あなたは優秀なリサーチアナリストです。提供された資料を横断的に分析し、構造化されたレポートを作成してください。",
                messages=[{
                    "role": "user",
                    "content": f"キーワード: {keyword}\n\n資料:\n{combined_text}\n\n上記資料を分析し、{keyword}に関するリサーチレポートをMarkdown形式で作成してください。"
                }]
            )
            return message.content[0].text

        if __name__ == "__main__":
            parser = argparse.ArgumentParser()
            parser.add_argument("keyword")
            parser.add_argument("files", nargs="+")
            args = parser.parse_args()

            result = research(args.keyword, args.files)
            output = Path(f"report_{args.keyword}.md")
            output.write_text(result)
            print(f"レポート生成完了: {output}")

      expected_output: "research_bot.py"
      test_command: "python research_bot.py 'Claude AI' sample_input.txt"
      notes: |
        - ANTHROPIC_API_KEY を .env ファイルに設定が必要
        - sample_input.txtも作成してテスト可能にする
        - README.mdに使い方を必ず記載

    status: "pending"
    completed_at: null
    output_path: null
    execution_notes: null

  - id: "task_002"
